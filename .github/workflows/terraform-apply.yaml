name: Terraform Apply

on:
  push:
    branches:
      - main

# Never let two applies race for the state lock.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  checks:
    name: static checks
    uses: ./.github/workflows/terraform-checks.yaml

  apply:
    name: tf apply
    runs-on: ubuntu-latest
    needs: checks
    # REQUIRED. The apply SA's workload identity binding only matches tokens
    # whose subject is repo:<org>/<repo>:environment:production, which a job
    # gets only by declaring this. If you do not create `production` with a
    # deployment branch rule limiting it to main, GitHub auto-creates it wide
    # open and any PR branch can mint this token. See the README.
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: gcp auth (tf apply)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # sbin/bootstrap fills these in from `terraform output`.
          workload_identity_provider: projects/CHANGEME/locations/global/workloadIdentityPools/gha-terraform-checker-pool/providers/gha-terraform-checker-provider
          service_account: gha-cloud-functions-deployment@CHANGEME.iam.gserviceaccount.com

      - name: terraform apply
        id: terraform-apply
        uses: dflook/terraform-apply@b7d589e72b3b2594f445627b351241d5c7dc78b6 # v3.0.0
        if: ${{ steps.auth.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          auto_approve: true
