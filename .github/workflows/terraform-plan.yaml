name: Terraform Plan

on:
  pull_request:
    branches:
      - main

# One plan per PR. A new push supersedes the in-flight run rather than racing it.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: static checks
    uses: ./.github/workflows/terraform-checks.yaml

  plan:
    name: tf plan
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: gcp auth (tf plan)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # sbin/bootstrap fills these in from `terraform output`.
          workload_identity_provider: projects/CHANGEME/locations/global/workloadIdentityPools/gha-terraform-checker-pool/providers/gha-terraform-checker-provider
          # Read-only: plan executes untrusted PR code, so this identity must
          # hold no write or secret-read permissions.
          service_account: gha-cf-tf-plan@CHANGEME.iam.gserviceaccount.com

      - name: terraform plan
        id: terraform-plan
        uses: dflook/terraform-plan@3f1559b085c5ceff68c3724c9b66c015a6c940cd # v3.0.0
        if: ${{ steps.auth.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The plan identity is read-only on the state bucket so it cannot
          # write a lock object. Plan never writes state, so this is safe --
          # see the note on tfstate-bucket-iam in infrastructure/main.tf.
          TF_CLI_ARGS_plan: -lock=false
        with:
          add_github_comment: changes-only
