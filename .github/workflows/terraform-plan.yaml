name: Terraform Plan

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: tf plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: gcp auth (tf plan)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/546928617664/locations/global/workloadIdentityPools/gha-terraform-checker-pool/providers/gha-terraform-checker-provider
          # Read-only identity: plan runs against untrusted PR code and must not
          # hold write or secret-read permissions.
          service_account: gha-cf-tf-plan@jeffreyhung-test.iam.gserviceaccount.com

      - name: terraform plan
        id: terraform-plan
        uses: dflook/terraform-plan@3f1559b085c5ceff68c3724c9b66c015a6c940cd # v3.0.0
        if:
          ${{ steps.auth.outcome == 'success'}}
        with:
          add_github_comment: changes-only
        env:
            GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
