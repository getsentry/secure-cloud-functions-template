# A Cloud Workflow triggered by Eventarc from a Pub/Sub message. Eventarc passes
# the CloudEvent as the workflow's input, so the first argument is the event.

main:
  params: [event]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - url: ${"https://" + location + "-" + project + ".cloudfunctions.net/function-cron"}
          - payload: ""

    # Message bodies arrive base64-encoded, and are absent for an
    # attributes-only message.
    - decode_message:
        switch:
          - condition: ${"data" in event and "message" in event.data and "data" in event.data.message}
            steps:
              - do_decode:
                  assign:
                    - payload: ${text.decode(base64.decode(event.data.message.data))}

    - log_event:
        call: sys.log
        args:
          text: ${"received pub/sub message: " + payload}

    - call_function:
        call: http.post
        args:
          url: ${url}
          body:
            message: ${payload}
          auth:
            type: OIDC
            audience: ${url}
        result: response

    - done:
        return: ${response.body}
