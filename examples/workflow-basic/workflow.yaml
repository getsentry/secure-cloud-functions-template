# A Cloud Workflow that calls a Cloud Function.
#
# The ${...} below is Cloud Workflows syntax, evaluated by GCP at runtime.
# Terraform reads this file verbatim, so it reaches GCP untouched.

main:
  steps:
    # Build the URL from the runtime environment rather than hardcoding a
    # project and region.
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - function_name: function-cron
          - url: ${"https://" + location + "-" + project + ".cloudfunctions.net/" + function_name}

    - call_function:
        call: http.post
        args:
          url: ${url}
          # The workflow's service account only has invoker on the functions
          # listed under `functions:` in terraform.yaml -- omit one and this
          # returns 403.
          auth:
            type: OIDC
            audience: ${url}
        result: response

    - log_result:
        call: sys.log
        args:
          text: ${"function returned " + string(response.code)}

    - done:
        return: ${response.body}
